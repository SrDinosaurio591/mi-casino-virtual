function drawPlinko(ball) {
  const c = document.getElementById("plinko");
  if (!c) return;
  const w = c.clientWidth || 640;
  const h = 420;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (c.width !== Math.floor(w * dpr)) {
    c.width = Math.floor(w * dpr);
    c.height = Math.floor(h * dpr);
  }
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#0e2a21";
  ctx.fillRect(0, 0, w, h);
  const rows = 12;
  for (let r = 0; r < rows; r++) {
    const count = r + 3;
    for (let i = 0; i < count; i++) {
      const x = w / 2 + (i - (count - 1) / 2) * (w / (rows + 3));
      const y = 28 + r * ((h - 78) / rows);
      ctx.beginPath();
      ctx.arc(x, y, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = "#e7d7b1";
      ctx.fill();
    }
  }
  const mults = PLINKO_MULT;
  const bw = w / mults.length;
  mults.forEach((m, i) => {
    ctx.fillStyle = m >= 5 ? "#8e2e2e" : m >= 1 ? "#c6a15b" : "#14382c";
    ctx.fillRect(i * bw + 2, h - 34, bw - 4, 26);
    ctx.fillStyle = "#f7f1e6";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("×" + m, i * bw + bw / 2, h - 16);
  });
  if (ball) {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = "#f4efe4";
    ctx.strokeStyle = "#c6a15b";
    ctx.lineWidth = 2;
    ctx.fill();
    ctx.stroke();
  }
}
function plinkoPos(w, h, path, t) {
  const d0 = Math.min(path.length, Math.floor(t));
  const u = t >= path.length ? 1 : t - d0;
  const r0 = path.slice(0, d0).reduce((a, b) => a + b, 0);
  const r1 = r0 + (d0 < path.length ? path[d0] : 0);
  const d1 = Math.min(path.length, d0 + 1);
  const x0 = ((r0 + 0.5) / (d0 + 1)) * w;
  const x1 = ((r1 + 0.5) / (d1 + 1)) * w;
  const ease = u * u * (3 - 2 * u);
  const x = x0 + (x1 - x0) * (t >= path.length ? 1 : ease);
  const y = 18 + (Math.min(path.length, t) / path.length) * (h - 70);
  return { x, y };
}

  } else if (view === "hilo") {
    if (act === "hi-start") hiloStart();
    else if (act === "hi-guess") hiloGuess(b.dataset.k);
    else if (act === "hi-cash") hiloCash();
  } else if (view === "keno") {
    if (act === "ke-tog") kenoToggle(Number(b.dataset.n));
    else if (act === "ke-clear") { game.picks = []; game.drawn = []; render(); }
    else if (act === "ke-draw") kenoDraw();
  } else if (view === "sicbo") {
    if (act === "si-m") { game.market = b.dataset.m; if (game.market === "total") game.pick = 10; if (game.market === "triple" || game.market === "face") game.pick = 1; render(); }
    else if (act === "si-p") { game.pick = Number(b.dataset.n); render(); }
    else if (act === "si-add") sicAdd(Number(b.dataset.n));
    else if (act === "si-clear") { if (game.amt) receive(game.amt); game.amt = 0; render(); }
    else if (act === "si-roll") sicRoll();
  } else if (view === "tripoker") {
    if (act === "tr-pair") { game.pairOn = !game.pairOn; render(); }
    else if (act === "tr-deal") triDeal();
    else if (act === "tr-play") {
      if (!spend(game.bet)) { note = "No alcanzas para igualar el ante."; render(); return; }
      game.risk += game.bet; game.playBet = game.bet; triResolve(true);
    } else if (act === "tr-fold") triResolve(false);
    else if (act === "tr-reset") { game.phase = "bet"; game.player = null; game.dealer = null; game.trap = false; game.reveal = false; render(); }
  } else if (view === "plinko" && act === "pl-drop") dropPlinko();
  else if (view === "reddog") {
    if (act === "rd-deal") rdDeal();
    else if (act === "rd-raise") rdFinish(true);
    else if (act === "rd-stay") rdFinish(false);
    else if (act === "rd-reset") { game.phase = "bet"; game.a = null; game.trap = false; game.msg = ""; render(); }
  } else if (view === "rueda") {
    if (act === "rw-pick" && !locked) { game.pick = b.dataset.id; render(); }
    else if (act === "rw-spin") spinRueda();
  } else if (view === "horses") {
    if (act === "ho-pick" && game.phase === "bet" && !locked) { game.pick = Number(b.dataset.i); render(); }
    else if (act === "ho-go") startRace();
    else if (act === "ho-reset") { game.phase = "bet"; game.msg = ""; render(); }
  } else if (view === "mines") {
    if (act === "mn-n" && game.phase === "bet") { game.mines = Number(b.dataset.n); render(); }
    else if (act === "mn-start") minesStart();
    else if (act === "mn-pick") minesPick(Number(b.dataset.i));
    else if (act === "mn-cash") minesCash();
    else if (act === "mn-reset") { game.phase = "bet"; game.open = []; game.bombs = null; game.msg = ""; game.trap = false; render(); }
  } else if (view === "crash") {
    if (act === "cr-go") flyCrash();
    else if (act === "cr-cash" && game.cashNow) game.cashNow();
    else if (act === "cr-auto-tog" && game.phase !== "fly") { game.autoOn = !game.autoOn; render(); }
    else if (act === "cr-auto" && game.phase !== "fly") {
      game.auto = Math.min(100, Math.max(1.1, Math.round((game.auto + Number(b.dataset.d)) * 10) / 10));
      render();
    } else if (act === "cr-auto-set" && game.phase !== "fly") { game.auto = Number(b.dataset.n); game.autoOn = true; render(); }
  } else if (view === "bingo") {
    if (act === "bi-go") bingoGo();
    else if (act === "bi-reset") { game.phase = "bet"; game.cells = null; game.drawn = []; game.msg = ""; render(); }
  }
}
function boot() {
  loadSave();
  render();
}
document.getElementById("app").addEventListener("click", onClick);
boot();
</script>
